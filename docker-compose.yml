services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data   # persist SQLite, Kuzu, ChromaDB, uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
